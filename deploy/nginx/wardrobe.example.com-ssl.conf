server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wardrobe.example.com;
    ssl_certificate /etc/letsencrypt/live/wardrobe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wardrobe.example.com/privkey.pem;
    access_log off;
    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:8830;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }
}
