server {
    listen 80;
    listen [::]:80;
    server_name wardrobe.example.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wardrobe-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://wardrobe.example.com$request_uri;
    }
}
